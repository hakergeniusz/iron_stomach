[package]
name = "horizon-iron_stomach"
version = "1.1.0"
edition = "2024"
license = "MIT"
description = "Holds the local player's hunger: food never drains and starvation never hurts, while LAN guests and mobs keep vanilla hunger. A Horizon native mod."
publish = false

# The runtime doubles as the mod's library (its tests) and carries the frozen
# decision's rules; the bundle's helper files compile only inside the game.
[lib]
path = "mixins/iron_stomach/runtime.rs"
