[mod]
id = "iron_stomach"
version = "1.2.0"
priority = 100

# The commit it was tested on: it holds the server-side food tick whole for
# one captured entity id, so a Horizon change in the hunger sources or the
# native tick hook needs a re-check.
[compatibility]
horizon_revision = "2ebf00a0281c592f79191e76fce0e7d522c6f425"

# The captured decision the food tick reads: which entity id is this
# window's local player. `pub` so the tick hook's helper (a different crate
# at this Horizon revision) can reach it.
[[module]]
id = "gate"
file = "crates/horizon-client/src/hunger.rs"
name = "iron_stomach_gate"
source = "gate.rs"
visibility = "pub"

# Every tick, the window game publishes its local player's entity id —
# `game.remote`'s — and clears it once the world is gone. It also publishes
# whether its world is open to the network (the LAN host flag) and syncs the
# saved guest-protection choice once per process. Server games (the single
# player server thread, dedicated servers) leave the decision alone.
[[injection]]
id = "capture"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "writer.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The local player's food tick, held whole while the decision says so: no
# drain, no hunger-cost healing, no starvation damage — and, while the
# window hosts a LAN world with guest protection on, every player's tick on
# that world. Cancellable HEAD — The freeze: exhaustion zeroed and the food
# level floored at full, then the tick runs — the drain never fires and the
# vanilla regeneration inside it keeps healing.
[[injection]]
id = "hold"
kind = "HEAD"
cancellable = true
target = "horizon_client::hunger::PlayerMotion::food_tick"
helper = "hold.rs"
bindings = [
  { name = "player", ty = "&mut PlayerMotion", value = "&mut *self" },
]

# The row in Options > Mods: the mod and what it does.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# The settings page: the guest-protection toggle and a live hosting note.
[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

# A click on the settings page: button 0 toggles guest protection and saves
# the choice to config/iron_stomach/guests.txt.
[[injection]]
id = "settings-click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "setting_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
